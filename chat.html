<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackbox AI Web Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-gradient: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --user-msg-bg: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      --ai-msg-bg: rgba(30, 41, 59, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .chat-container {
      width: 90vw;
      max-width: 900px;
      height: 90vh;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(139, 92, 246, 0.15);
      overflow: hidden;
    }

    /* Header */
    .header {
      padding: 18px 24px;
      background: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      background: var(--accent-gradient);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 20px;
      color: white;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
    }

    .brand-title h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(90deg, #fff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-title p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    select, input[type="text"] {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--glass-border);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
    }

    /* Messages Area */
    .messages-area {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .messages-area::-webkit-scrollbar {
      width: 6px;
    }
    .messages-area::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 80%;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.assistant {
      align-self: flex-start;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .user .avatar {
      background: #4f46e5;
      color: white;
    }

    .assistant .avatar {
      background: var(--accent-gradient);
      color: white;
    }

    .bubble {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .user .bubble {
      background: var(--user-msg-bg);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .assistant .bubble {
      background: var(--ai-msg-bg);
      color: #e2e8f0;
      border: 1px solid var(--glass-border);
      border-bottom-left-radius: 4px;
    }

    .bubble code {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 13px;
      color: #a7f3d0;
    }

    .bubble pre {
      background: #090d16;
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 8px 0;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .bubble pre code {
      background: transparent;
      padding: 0;
      color: #e2e8f0;
    }

    /* Input Area */
    .input-area {
      padding: 18px 24px;
      background: rgba(15, 23, 42, 0.6);
      border-top: 1px solid var(--glass-border);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .input-box {
      flex: 1;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 14px 18px;
      color: white;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      resize: none;
      height: 52px;
      max-height: 120px;
      transition: border-color 0.2s;
    }

    .input-box:focus {
      border-color: var(--accent-purple);
    }

    .send-btn {
      width: 52px;
      height: 52px;
      background: var(--accent-gradient);
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
    }

    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(168, 85, 247, 0.4);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Typing Dots */
    .typing-indicator {
      display: flex;
      gap: 5px;
      padding: 4px 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: var(--accent-cyan);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="header">
      <div class="brand">
        <div class="logo-badge">⚡</div>
        <div class="brand-title">
          <h1>Blackbox AI Chat</h1>
          <p>Powered by Open-Source Models</p>
        </div>
      </div>
      <div class="controls">
        <select id="modelSelect">
          <option value="blackboxai/meta/llama-3.1-8b">Llama 3.1 8B</option>
          <option value="blackboxai/meta/llama-3.1-70b">Llama 3.1 70B</option>
          <option value="blackboxai/mistral/codestral">Mistral Codestral</option>
          <option value="blackboxai/mistral/mistral-small">Mistral Small</option>
          <option value="blackboxai/amazon/nova-2-lite">Amazon Nova 2 Lite</option>
        </select>
        <input type="text" id="apiKeyInput" value="sk-HWZ8rMF9V-4VslGprA_n2w" placeholder="API Key" style="width: 170px;">
      </div>
    </div>

    <div class="messages-area" id="messagesArea">
      <div class="message assistant">
        <div class="avatar">⚡</div>
        <div class="bubble">Hello! I am ready to help you with coding, writing, or answering questions. How can I assist you today?</div>
      </div>
    </div>

    <div class="input-area">
      <textarea id="userInput" class="input-box" placeholder="Type your message here... (Press Enter to send)"></textarea>
      <button id="sendBtn" class="send-btn">➔</button>
    </div>
  </div>

  <script>
    const messagesArea = document.getElementById('messagesArea');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const modelSelect = document.getElementById('modelSelect');
    const apiKeyInput = document.getElementById('apiKeyInput');

    let history = [
      { role: "system", content: "You are a helpful AI assistant." }
    ];

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert("Please enter a valid API key.");
        return;
      }

      // Render user message
      appendMessage('user', text);
      history.push({ role: 'user', content: text });
      userInput.value = '';

      // Disable inputs while generating
      sendBtn.disabled = true;
      userInput.disabled = true;

      // Render typing placeholder
      const aiMsgElement = appendMessage('assistant', '<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>');
      const bubble = aiMsgElement.querySelector('.bubble');

      try {
        const response = await fetch('https://api.blackbox.ai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: modelSelect.value,
            messages: history,
            stream: true
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || `HTTP error! status: ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let fullReply = '';
        bubble.innerHTML = ''; // Clear typing dots

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const dataStr = line.replace('data: ', '').trim();
              if (dataStr === '[DONE]') continue;
              try {
                const parsed = JSON.parse(dataStr);
                const token = parsed.choices[0]?.delta?.content || '';
                fullReply += token;
                bubble.innerText = fullReply;
                messagesArea.scrollTop = messagesArea.scrollHeight;
              } catch (e) {
                // Ignore incomplete JSON chunks in stream
              }
            }
          }
        }

        if (fullReply) {
          history.push({ role: 'assistant', content: fullReply });
        } else {
          bubble.innerText = 'No response generated.';
        }

      } catch (err) {
        bubble.innerText = `Error: ${err.message}`;
      } finally {
        sendBtn.disabled = false;
        userInput.disabled = false;
        userInput.focus();
      }
    }

    function appendMessage(role, htmlOrText) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      msgDiv.innerHTML = `
        <div class="avatar">${role === 'user' ? '👤' : '⚡'}</div>
        <div class="bubble">${htmlOrText}</div>
      `;
      messagesArea.appendChild(msgDiv);
      messagesArea.scrollTop = messagesArea.scrollHeight;
      return msgDiv;
    }
  </script>
</body>
</html>
